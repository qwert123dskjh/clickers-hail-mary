<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Clicker</title>
    <link href="style.css" rel="stylesheet">
    <style>
        .menu-container {
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 50px 20px;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .menu-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .menu-btn:hover {
            transform: scale(1.05);
        }
        .btn-amirali { background-color: #007bff; }
        .btn-amirali:hover { background-color: #0056b3; }
        .btn-kenneth { background-color: #28a745; }
        .btn-kenneth:hover { background-color: #218838; }
        .btn-vlada { background-color: #dc3545; }
        .btn-vlada:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <div class="menu-container">
        <h1>Welcome to the Clicker Universe</h1>
        <p>Select a character below to start playing!</p>
        
        <div class="button-group">
            <button class="menu-btn btn-amirali" onclick="window.location.href='./amirali.html'">Amirali Clicker</button>
            <button class="menu-btn btn-kenneth" onclick="window.location.href='./kenneth.html'">Kenneth Clicker</button>
            <button class="menu-btn btn-vlada" onclick="window.location.href='./vlada.html'">Vlada Clicker</button>
        </div>
    </div>
</body>
</html>
