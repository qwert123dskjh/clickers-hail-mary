<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Clicker</title>
    <style>
        body { margin: 0; background: black; color: #e6e6e6; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .menu-container { text-align: center; padding: 40px 20px; max-width: 900px; width: 100%; }
        header { background: #373737; border-radius: 12px; padding: 20px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        header h1 { margin: 0 0 10px 0; font-size: 2.5rem; letter-spacing: 1px; }
        header p { margin: 0; color: #b4b4b4; }
        
        /* --- Card Layout & Base Elements --- */
        .button-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 10px; }
        .character-card { background: #373737; border-radius: 12px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; transition: 0.2s; cursor: pointer; border: 2px solid transparent; box-sizing: border-box; }
        .character-card:active { transform: scale(0.98); }
        .character-card h2 { margin: 0 0 15px 0; font-size: 1.5rem; }
        .menu-btn { border-radius: 12px; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; width: 100%; transition: 0.2s; cursor: pointer; }

        /* --- Amirali Monochrome Theme --- */
        .card-amirali { background: #262626; border-color: #555555; }
        .card-amirali:hover { transform: translateY(-5px); border-color: #ffffff; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); }
        .btn-amirali { background: #535353; color: #e6e6e6; }
        .card-amirali:hover .btn-amirali { background: #ffffff; color: #000000; box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }

        /* --- Kenneth Green Theme --- */
        .card-kenneth:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(6, 226, 47, 0.4); }
        .btn-kenneth { background: #535353; color: #e6e6e6; }
        .card-kenneth:hover .btn-kenneth { background: #06e22f; color: black; box-shadow: 0 0 15px rgba(6, 226, 47, 0.6); }

        /* --- Vlada Retro Theme --- */
        .card-vlada { background: #d9d484; color: #9f4998; }
        .card-vlada:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(217, 212, 132, 0.4); }
        .btn-vlada { background: #485523; color: #9f4998; }
        .card-vlada:hover .btn-vlada { background: #f3f0ce; box-shadow: 0 0 15px rgba(243, 240, 206, 0.6); }
    </style>
</head>
<body>
    <div class="menu-container">
        <header>
            <h1>Clicker Universe</h1>
            <p>Select your planet to load your saved data and begin clicking!</p>
        </header>
        
        <div class="button-group">
            <div class="character-card card-amirali" onclick="window.location.href='./amirali.html'">
                <h2>Amirali</h2>
                <button class="menu-btn btn-amirali">Enter Planet</button>
            </div>
            
            <div class="character-card card-kenneth" onclick="window.location.href='./kenneth.html'">
                <h2>Kenneth</h2>
                <button class="menu-btn btn-kenneth">Enter Planet</button>
            </div>
            
            <div class="character-card card-vlada" onclick="window.location.href='./vlada.html'">
                <h2>Vlada</h2>
                <button class="menu-btn btn-vlada">Enter Planet</button>
            </div>
        </div>
    </div>
</body>
</html>
